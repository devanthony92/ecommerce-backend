[project]
name = "trama-api"
version = "0.1.0"
description = "API de la tienda Trama (FastAPI + PostgreSQL)"
authors = [{ name = "Anthony Martinez" }]
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declara dependencias como valores por defecto: Depends(...), Query(...).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
